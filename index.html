<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="SAT Sprint — a calm, fast, client-side Digital SAT practice app with instant teaching feedback." />
    <meta property="og:title" content="SAT Sprint — personalized prep" />
    <meta property="og:description" content="Calm, fast, client-side Digital SAT practice with instant teaching feedback." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Ctext x='32' y='44' font-family='-apple-system,Segoe UI,Roboto,sans-serif' font-size='36' font-weight='800' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E"
    />
    <!-- PNG fallbacks: Safari doesn't render SVG favicons; iOS home screen needs PNG. -->
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>SAT Sprint — personalized prep</title>
    <script>
      // Apply the saved theme before the first paint so there's no light/dark
      // flash, and keep the browser-chrome color (theme-color) in step.
      try {
        var t = localStorage.getItem('sat.theme');
        var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', dark ? '#0f172a' : '#f8fafc');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
